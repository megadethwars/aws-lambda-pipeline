
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Instalando dependencias (si existen requirements.txt)"
      - 'if [ -f requirements.txt ]; then pip install -r requirements.txt -t .; fi'
  build:
    commands:
      - echo "Empaquetando código para Lambda"
      - zip -r lambda.zip main.py requirements.txt

artifacts:
  files:
    - lambda.zip
